<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Changelog — abstract</title>
    <meta name="description" content="Release notes for abstract, the local-first markdown notes editor." />
    <meta name="theme-color" content="#f6f6f4" />
    <link rel="icon" href="/media/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (() => { const t = localStorage.getItem("theme"); const p = t === "dark" || t === "light" ? t : "system"; const d = p === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : p === "dark"; document.documentElement.dataset.theme = d ? "dark" : "light"; document.documentElement.dataset.themePref = p; if (matchMedia("(prefers-reduced-motion: reduce), (max-width: 860px), (hover: none) and (pointer: coarse)").matches) document.documentElement.classList.add("lite"); })();
    </script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <!-- @topbar -->

    <main class="wrap changelog">
      <h1>Changelog.</h1>
      <p class="lede">Every release of abstract, straight from
        <a href="https://github.com/fireflylabss/abstract/releases" target="_blank" rel="noreferrer">GitHub Releases</a>.</p>
      <div id="releases"><p class="rel-loading">Loading releases…</p></div>
    </main>

    <!-- @footer -->

    <script type="module" src="/src/changelog.ts"></script>
  </body>
</html>
